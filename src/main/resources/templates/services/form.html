<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='Service Form - PC Manager')}"></head>

<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0" th:text="${service.id == null ? 'Add Service' : 'Edit Service'}"></h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/services/save}" th:object="${service}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            </div>

                            <div class="mb-3">
                                <label for="softwareStack" class="form-label">Software Stack</label>
                                <select class="form-select" id="softwareStack" th:field="*{softwareStack}">
                                    <option value="">- Select Stack -</option>
                                    <option th:each="stack : ${stacks}" th:value="${stack.id}" th:text="${stack.name}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="status" class="form-label">Status</label>
                                <input type="text" class="form-control" id="status" th:field="*{status}" placeholder="e.g. running, stopped">
                            </div>

                            <div class="mb-3">
                                <label for="port" class="form-label">Port</label>
                                <input type="number" class="form-control" id="port" th:field="*{port}">
                            </div>

                            <div class="mb-3">
                                <label for="installedAt" class="form-label">Installed At</label>
                                <input type="datetime-local" class="form-control" id="installedAt" th:field="*{installedAt}">
                            </div>

                            <div class="mb-3">
                                <label for="lastUpdated" class="form-label">Last Updated</label>
                                <input type="datetime-local" class="form-control" id="lastUpdated" th:field="*{lastUpdated}">
                            </div>

                            <div class="mb-3">
                                <label for="softwareList" class="form-label">Software Dependencies</label>
                                <select class="form-select" id="softwareList" th:field="*{softwareList}" multiple style="height: 120px;">
                                    <option th:each="sw : ${allSoftware}" th:value="${sw.id}"
                                        th:selected="${service.softwareList != null and service.softwareList.contains(sw)}"
                                        th:text="${sw.name + (sw.installedVersion != null ? ' (' + sw.installedVersion + ')' : '')}"></option>
                                </select>
                                <div class="form-text">Hold Ctrl/Cmd to select multiple.</div>
                            </div>

                            <div class="mb-3">
                                <label for="subdatabaseList" class="form-label">Subdatabase Dependencies</label>
                                <select class="form-select" id="subdatabaseList" th:field="*{subdatabaseList}" multiple style="height: 120px;">
                                    <option th:each="subdb : ${allSubdatabases}" th:value="${subdb.id}"
                                        th:selected="${service.subdatabaseList != null and service.subdatabaseList.contains(subdb)}"
                                        th:text="${subdb.name + (subdb.databaseInstance != null ? ' @ ' + subdb.databaseInstance.name : '')}"></option>
                                </select>
                                <div class="form-text">Hold Ctrl/Cmd to select multiple.</div>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/services}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-success">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
