<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='PCs - PC Manager')}"></head>

<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>PCs</h2>
            <a th:href="@{/pcs/add}" class="btn btn-primary">Add New PC</a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-striped">
                <thead class="table-secondary">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>MAC Address</th>
                        <th>Base Price</th>
                        <th>Actual Price</th>
                        <th>Bought At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pc : ${pcs}">
                        <td th:text="${pc.id}"></td>
                        <td th:text="${pc.name}"></td>
                        <td th:text="${pc.macAddress}"></td>
                        <td th:text="${pc.basePrice}"></td>
                        <td class="fw-bold" th:text="${pc.price}"></td>
                        <td th:text="${#temporals.format(pc.boughtAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <a th:href="@{/pcs/edit/{id}(id=${pc.id})}" class="btn btn-sm btn-warning">Edit</a>
                            <a th:href="@{/pcs/delete/{id}(id=${pc.id})}" class="btn btn-sm btn-danger"
                                onclick="return confirm('Are you sure?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${pcs.empty}">
                        <td colspan="7" class="text-center text-muted py-3">No PCs found. Add some!</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-end mt-3">
            <h4 class="mb-0">Total PCs Price: <span class="text-success" th:text="${totalPrice}"></span></h4>
        </div>

        <hr class="my-5">

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-secondary text-white">
                <h4 class="mb-0">View Components by PC</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/pcs}" method="get" class="row g-3 align-items-end mb-4">
                    <div class="col-md-8">
                        <label for="pcId" class="form-label">Select PC</label>
                        <select class="form-select" id="pcId" name="pcId" onchange="this.form.submit()">
                            <option value="">- Choose a PC -</option>
                            <option th:each="pc : ${pcs}" th:value="${pc.id}" th:text="${pc.name}"
                                th:selected="${selectedPC != null and selectedPC.id == pc.id}"></option>
                        </select>
                    </div>
                </form>

                <div th:if="${selectedPC != null}">
                    <h5 class="mb-3">Components in <span class="text-primary" th:text="${selectedPC.name}"></span></h5>
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Type</th>
                                    <th>Model</th>
                                    <th>Manufacturer</th>
                                    <th>Vendor</th>
                                    <th>Price</th>
                                    <th>Bought At</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="component : ${pcComponents}">
                                    <td th:text="${component.id}"></td>
                                    <td
                                        th:text="${component.componentType != null ? component.componentType.name : ''}">
                                    </td>
                                    <td th:text="${component.model}"></td>
                                    <td th:text="${component.manufacturer}"></td>
                                    <td th:text="${component.vendor}"></td>
                                    <td th:text="${component.price}"></td>
                                    <td th:text="${#temporals.format(component.boughtAt, 'yyyy-MM-dd HH:mm')}"></td>
                                </tr>
                                <tr th:if="${pcComponents.empty}">
                                    <td colspan="7" class="text-center text-muted">No components assigned to this PC.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
