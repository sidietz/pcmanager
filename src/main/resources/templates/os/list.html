<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='Operating Systems - PC Manager')}"></head>

<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Operating Systems</h2>
            <a th:href="@{/os/add}" class="btn btn-primary">Add New OS</a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-striped">
                <thead class="table-secondary">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Version</th>
                        <th>OS Family</th>
                        <th>Release Type</th>
                        <th>EOL Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="os : ${oss}">
                        <td th:text="${os.id}"></td>
                        <td th:text="${os.name}"></td>
                        <td th:text="${os.version}"></td>
                        <td th:text="${os.osFamily}"></td>
                        <td th:text="${os.releaseType}"></td>
                        <td th:text="${os.eolDate}"></td>
                        <td>
                            <a th:href="@{/os/edit/{id}(id=${os.id})}" class="btn btn-sm btn-warning">Edit</a>
                            <a th:href="@{/os/delete/{id}(id=${os.id})}" class="btn btn-sm btn-danger"
                                onclick="return confirm('Are you sure?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${oss.empty}">
                        <td colspan="4" class="text-center text-muted py-3">No Operating Systems found. Add some!</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
