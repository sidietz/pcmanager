<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='Software Stack Form - PC Manager')}"></head>

<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0" th:text="${stack.id == null ? 'Add Software Stack' : 'Edit Software Stack'}">
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/software-stacks/save}" th:object="${stack}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            </div>

                            <div class="mb-3">
                                <label for="softwareList" class="form-label">Software Components</label>
                                <select class="form-select" id="softwareList" th:field="*{softwareList}" multiple
                                    style="height: 150px;">
                                    <option th:each="sw : ${allSoftware}" th:value="${sw.id}"
                                        th:selected="${stack.softwareList != null and stack.softwareList.contains(sw)}"
                                        th:text="${sw.name + ' (' + sw.installedVersion + ')'}"></option>
                                </select>
                                <div class="form-text">Hold Ctrl/Cmd to select multiple.</div>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/software-stacks}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-success">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
