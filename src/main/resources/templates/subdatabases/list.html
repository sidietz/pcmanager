<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='Subdatabases - PC Manager')}"></head>

<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Subdatabases</h2>
            <a th:href="@{/subdatabases/add}" class="btn btn-primary">Add New Subdatabase</a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-striped">
                <thead class="table-secondary">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Database Instance</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="subdb : ${subdatabases}">
                        <td th:text="${subdb.id}"></td>
                        <td th:text="${subdb.name}"></td>
                        <td th:text="${subdb.databaseInstance != null ? (subdb.databaseInstance.name + (subdb.databaseInstance.softwareStack != null ? ' (' + subdb.databaseInstance.softwareStack.name + ')' : '')) : 'None'}"></td>
                        <td th:text="${subdb.createdAt != null ? #temporals.format(subdb.createdAt, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
                        <td>
                            <a th:href="@{/subdatabases/edit/{id}(id=${subdb.id})}" class="btn btn-sm btn-warning">Edit</a>
                            <a th:href="@{/subdatabases/delete/{id}(id=${subdb.id})}" class="btn btn-sm btn-danger"
                                onclick="return confirm('Are you sure?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${subdatabases.empty}">
                        <td colspan="5" class="text-center text-muted py-3">No Subdatabases found. Add some!</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
