<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='Component Form - PC Manager')}"></head>

<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0" th:text="${component.id == null ? 'Add Component' : 'Edit Component'}"></h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/components/save}" th:object="${component}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="componentType" class="form-label">Type</label>
                                <input type="text" class="form-control" id="componentType" th:field="*{componentType}"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="model" class="form-label">Model</label>
                                <input type="text" class="form-control" id="model" th:field="*{model}">
                            </div>

                            <div class="mb-3">
                                <label for="manufacturer" class="form-label">Manufacturer</label>
                                <input type="text" class="form-control" id="manufacturer" th:field="*{manufacturer}">
                            </div>

                            <div class="mb-3">
                                <label for="vendor" class="form-label">Vendor</label>
                                <input type="text" class="form-control" id="vendor" th:field="*{vendor}">
                            </div>

                            <div class="mb-3">
                                <label for="price" class="form-label">Price</label>
                                <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}">
                            </div>

                            <div class="mb-3">
                                <label for="boughtAt" class="form-label">Bought At</label>
                                <input type="datetime-local" class="form-control" id="boughtAt" th:field="*{boughtAt}">
                            </div>

                            <div class="mb-3">
                                <label for="pc" class="form-label">Assign to PC (Optional)</label>
                                <select class="form-select" id="pc" name="pc">
                                    <option value="" th:selected="${component.pc == null}">- Unassigned -</option>
                                    <option th:each="pcItem : ${pcs}" th:value="${pcItem.id}" th:text="${pcItem.name}"
                                        th:selected="${component.pc != null and component.pc.id == pcItem.id}"></option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/components}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-success">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
