<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='Appliances - PC Manager')}"></head>

<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Appliances</h2>
            <a th:href="@{/appliances/add}" class="btn btn-primary">Add New Appliance</a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Operating System</th>
                        <th>Software Stack</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="app : ${appliances}">
                        <td th:text="${app.id}"></td>
                        <td th:text="${app.name}"></td>
                        <td th:text="${app.operatingSystem != null ? app.operatingSystem.name : 'None'}"></td>
                        <td th:text="${app.softwareStack != null ? app.softwareStack.name : 'None'}"></td>
                        <td>
                            <a th:href="@{/appliances/edit/{id}(id=${app.id})}" class="btn btn-sm btn-warning">Edit</a>
                            <a th:href="@{/appliances/delete/{id}(id=${app.id})}" class="btn btn-sm btn-danger"
                                onclick="return confirm('Are you sure?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${appliances.empty}">
                        <td colspan="5" class="text-center text-muted py-3">No Appliances found. Add some!</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
