<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">PC Manager</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 60px;
        }

        .card {
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .table-responsive {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background-color: white;
        }

        table {
            margin-bottom: 0 !important;
        }

        th {
            background-color: #f8f9fa !important;
            border-top: none !important;
        }

        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">💻 PC Manager</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" th:href="@{/pcs}">PCs</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/components}">Components</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/appliances}">Appliances</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/os}">Operating Systems</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/software-stacks}">Software Stacks</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/software}">Software</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div th:fragment="scripts">
        <!-- Bootstrap Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </div>

</body>

</html>
