<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='Database Product Form - PC Manager')}"></head>

<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0" th:text="${product.id == null ? 'Add Database Product' : 'Edit Database Product'}"></h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/database-products/save}" th:object="${product}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="vendorName" class="form-label">Vendor Name</label>
                                <input type="text" class="form-control" id="vendorName" th:field="*{vendorName}" required>
                            </div>

                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            </div>

                            <div class="mb-3">
                                <label for="latestVersion" class="form-label">Latest Version</label>
                                <input type="text" class="form-control" id="latestVersion" th:field="*{latestVersion}">
                            </div>

                            <div class="mb-3">
                                <label for="releasedAt" class="form-label">Released At</label>
                                <input type="date" class="form-control" id="releasedAt" th:field="*{releasedAt}">
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/database-products}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-success">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
