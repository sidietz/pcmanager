<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='Database Products - PC Manager')}"></head>

<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Database Products</h2>
            <a th:href="@{/database-products/add}" class="btn btn-primary">Add New DB Product</a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-striped">
                <thead class="table-secondary">
                    <tr>
                        <th>ID</th>
                        <th>Vendor Name</th>
                        <th>Name</th>
                        <th>Latest Version</th>
                        <th>Released At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prod : ${products}">
                        <td th:text="${prod.id}"></td>
                        <td th:text="${prod.vendorName}"></td>
                        <td th:text="${prod.name}"></td>
                        <td th:text="${prod.latestVersion}"></td>
                        <td th:text="${prod.releasedAt != null ? #temporals.format(prod.releasedAt, 'yyyy-MM-dd') : 'N/A'}"></td>
                        <td>
                            <a th:href="@{/database-products/edit/{id}(id=${prod.id})}" class="btn btn-sm btn-warning">Edit</a>
                            <a th:href="@{/database-products/delete/{id}(id=${prod.id})}" class="btn btn-sm btn-danger"
                                onclick="return confirm('Are you sure?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${products.empty}">
                        <td colspan="6" class="text-center text-muted py-3">No Database Products found. Add some!</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
